<svg width="520" height="160" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LUMA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b29"/>
      <stop offset="1" stop-color="#14131f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec7"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
    <radialGradient id="pet" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ffcf5c"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ec7" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff9ec7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="520" height="160" rx="28" fill="url(#bg)"/>

  <!-- estrelinhas de fundo -->
  <g fill="#fff" opacity=".5">
    <circle cx="350" cy="30" r="1.6"/>
    <circle cx="430" cy="52" r="1.2"/>
    <circle cx="486" cy="34" r="1.6"/>
    <circle cx="400" cy="120" r="1.2"/>
    <circle cx="470" cy="110" r="1.6"/>
  </g>

  <!-- mascote: estrelinha kawaii (Luma) -->
  <g transform="translate(86 80)">
    <circle r="58" fill="url(#aura)"/>
    <path d="M0 -44 L13 -12 L46 -8 L20 13 L28 46 L0 27 L-28 46 L-20 13 L-46 -8 L-13 -12 Z"
          fill="url(#pet)" stroke="#e7a92e" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-11" cy="0" r="6" fill="#3a2d12"/>
    <circle cx="11" cy="0" r="6" fill="#3a2d12"/>
    <circle cx="-9" cy="-2" r="1.8" fill="#fff"/>
    <circle cx="13" cy="-2" r="1.8" fill="#fff"/>
    <circle cx="-19" cy="9" r="4.5" fill="#ff9aa2" opacity=".6"/>
    <circle cx="19" cy="9" r="4.5" fill="#ff9aa2" opacity=".6"/>
    <path d="M-6 9 Q0 15 6 9" stroke="#3a2d12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="170" y="92" font-family="Quicksand, Nunito, Segoe UI, sans-serif"
        font-size="62" font-weight="800" fill="url(#ink)" letter-spacing="2">LUMA</text>
  <text x="172" y="122" font-family="Quicksand, Nunito, Segoe UI, sans-serif"
        font-size="16" font-weight="600" fill="#a79fce" letter-spacing="1.5">um ser vivo digital que cresce com você</text>
</svg>
